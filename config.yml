# Every true or false setting below can be overridden by an environment variable.
# The variable name comes from the setting's old nested path, for example antiAfkEnabled is
# UTILS_ANTI_AFK_ENABLED, circleWalkEnabled is MOVEMENT_CIRCLE_WALK_ENABLED and modulesCombat is MODULES_COMBAT
# (accepts true, false, 1, 0, yes, no, on, off)

# Name shown on the status page and used as the Discord webhook username
name: AFK Bot

# Accounts the bot can log in with (only the first entry is used)
accounts:
  - username: Minecraft # In-game name
    password: ""      # Account password, only needed for online accounts
    type: offline     # offline for cracked servers, microsoft for premium

# Minecraft server to join
serverHost: example.com            # Server address (the SERVER_HOST environment variable overrides it)
serverPort: 25565                  # Server port (the SERVER_PORT environment variable overrides it)
serverVersion: "1.21.1"            # Minecraft version the bot connects with
serverViewDistance: short          # Chunks kept in memory: tiny (2), short (4), normal (8), far (12) or a number. Lower uses less RAM
serverConnectTimeout: 60000        # ms to wait for the bot to spawn before retrying
serverKeepaliveTimeout: 120000     # ms without server packets before the connection is treated as dead

# Built-in status page and keep-alive
dashboardHost: 0.0.0.0             # Address the status page listens on
dashboardPort: 5000                # Status page port (the PORT environment variable overrides it)
dashboardRefreshInterval: 5000     # ms between status page refreshes
dashboardSelfPingInterval: 600000  # ms between self-pings (only active when PUBLIC_URL is set)

# Spot the bot walks to after spawning
positionEnabled: true # Walk to the coordinates below after joining
positionX: 0
positionY: 100
positionZ: 0

# Commands the bot sends in chat after spawning
startupCommandsDelay: 3000 # ms to wait after spawn before the first command
startupCommandsGap: 1000   # ms between each command
startupCommandsList:
  - /gamerule sendCommandFeedback false
  - /gamemode creative

# Answers the login or register prompt of auth plugins such as AuthMe
autoAuthEnabled: true
autoAuthPassword: ""                                      # Password used for both commands (AUTH_PASSWORD overrides it)
autoAuthRegisterTrigger: /register                        # Server message text that means a registration is required
autoAuthLoginTrigger: /login                              # Server message text that means a login is required
autoAuthRegisterCommand: /register {password} {password}  # Command sent on registration prompts
autoAuthLoginCommand: /login {password}                   # Command sent on login prompts

# Small repeated actions that stop the server from marking the bot as idle
antiAfkEnabled: true
antiAfkSneak: true        # Keep the bot sneaking
antiAfkInterval: 30000    # ms between jumps
antiAfkJumpDuration: 100  # ms the jump key is held

chatLog: true # Print in-game chat to the console

autoReconnect: true              # Rejoin automatically after a disconnect
autoReconnectDelay: 2000         # ms before the first reconnect attempt
maxReconnectDelay: 20000         # ms upper limit of the reconnect delay
reconnectBackoffStep: 1000       # ms added to the delay for every failed attempt

# Pings the server and only joins once it reports online, so a long outage does not spam login attempts
serverWatchEnabled: true
serverWatchInterval: 120000        # ms between status checks while the server is offline
serverWatchTimeout: 5000           # ms to wait for a status reply before treating the server as offline
serverWatchMaxTries: 30            # Failed checks in a row before the bot stops (use the join action to start it again)
serverWatchOfflinePattern: offline # Case-insensitive text in the server's version label that means offline (Aternos shows Offline)

# Leaves and rejoins at random intervals
periodicRejoinEnabled: false
periodicRejoinMinInterval: 20          # Shortest time in minutes before leaving
periodicRejoinMaxInterval: 60          # Longest time in minutes before leaving
periodicRejoinReason: Periodic Rejoin  # Quit reason, also used to skip the Discord disconnect alert

# Walks around the current position in a circle
circleWalkEnabled: true
circleWalkRadius: 4      # Blocks from the current position to each waypoint
circleWalkSpeed: 3000    # ms between waypoints
circleWalkAngleStep: 45  # Degrees the circle advances per waypoint

# Turns the head in random directions
lookAroundEnabled: true
lookAroundInterval: 5000  # ms between turns
lookAroundPitchRange: 45  # Total degrees of up and down head movement

# Jumps at a steady rate
randomJumpEnabled: true
randomJumpInterval: 10000    # ms between jumps
randomJumpDuration: 300      # ms the jump key is held

# Feature switches
modulesAvoidMobs: true # Step back when something gets close
modulesCombat: true    # Enable the combat section below
modulesBeds: true      # Sleep in a nearby bed at night
modulesChat: true      # Enable the chat section below

# Steps back when a mob or another player is too close
avoidMobsSafeDistance: 5    # Blocks
avoidMobsInterval: 2000     # ms between checks
avoidMobsBackDuration: 500  # ms the bot walks backwards

# Combat settings
combatAttackMobs: true      # Attack mobs in range
combatAttackRange: 4        # Blocks
combatAttackInterval: 1500  # ms between attacks
combatAutoEat: true         # Eat when hungry
combatEatBelow: 14          # Food level (0 to 20) that triggers eating

# Sleeping settings
bedsNightStart: 12500   # World time at which the bot starts looking for a bed
bedsNightEnd: 23500     # World time at which it stops
bedsSearchDistance: 8   # Blocks to look for a bed
bedsInterval: 10000     # ms between checks

# Replies to players in chat
chatRespond: true             # Reply to greetings
chatGreetings:                # Words that trigger a reply
  - hello
  - hi
chatReply: "Hello, {player}!" # Reply text, {player} is the sender's name

# Discord webhook alerts
discordEnabled: false
discordWebhook: ""               # Webhook URL (DISCORD_WEBHOOK_URL overrides it)
discordEventsConnect: true       # Alert when the bot joins
discordEventsDisconnect: true    # Alert when the bot leaves
discordColorsConnect: 4906624    # Embed color for join alerts (decimal)
discordColorsDisconnect: 16281969 # Embed color for leave alerts (decimal)
