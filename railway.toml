[build]
builder = "RAILPACK"
buildEnvironment = "V3"

[deploy]
runtime = "V2"
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 60
numReplicas = 1
sleepApplication = false
useLegacyStacker = false
ipv6EgressEnabled = false
multiRegionConfig = {"sfo":{"numReplicas":1}}
restartPolicyType = "ALWAYS"
